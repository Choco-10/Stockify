<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stockify Predictor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>Stockify Predictor</h2>

  <script src="config.js"></script>

  <div class="server-toggle" id="serverToggle">
    <span class="toggle-label" id="toggleLabel">Connecting...</span>
    <label class="switch">
      <input type="checkbox" id="serverSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <div class="search-row">
    <div class="search-container">
      <input type="text" id="stock-search" placeholder="Type company name...">
      <ul id="search-results"></ul>
    </div>
    <button id="predictBtn">Predict</button>
  </div>

  <h3>Prediction</h3>
  <div id="results">No prediction yet.</div>

  <h3>Saved Stocks</h3>
  <div id="savedStocks"></div>

  <script src="popup.js"></script>
</body>
</html>
